<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی شب یلدا</title>

<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet">

<style>
body { font-family: 'Vazir', sans-serif; direction: rtl; background: url("IMG_0144 copy.jpg") no-repeat center center fixed; background-size: cover; text-align: center; padding: 0; margin: 0; }
.overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(255,255,255,0.55); z-index: 0; }
.game-box { position: relative; z-index: 2; background: rgba(255,255,255,0.95); border-radius: 20px; padding: 30px 25px; max-width: 600px; margin: 70px auto; box-shadow: 0 0 18px rgba(0,0,0,0.15); }
h2 { color:#b30000; font-size: 24px; }
.option { background: white; padding: 12px; margin: 10px 0; border-radius: 12px; border: 2px solid #b30000; cursor: pointer; transition: .2s; font-size: 17px; }
.option:hover { background: #b30000; color: white; transform: scale(1.03); }
.correct { background: #4CAF50 !important; color: white; border-color: #4CAF50; }
.wrong { background: #ff4d4d !important; color: white; border-color: #ff4d4d; }
</style>
</head>

<body>

<div class="overlay"></div>

<div class="game-box">
  <h2 id="questionText"></h2>
  <div id="optionsBox"></div>
</div>

<script>
const questions = [
  { q: "خوبان پارسی‌گو بخشندگانِ عمرند...", opts: ["گر تو نمی‌پسندی تغییر کن قضا را","ساقی بده بشارت رندانِ پارسا","جواب تلخ می زیبد لب لعل شکرخا را"], answer: 1 },
  { q: ".... که من نسیم حیات از پیاله می‌جویم", opts: ["بادت به دست باشد اگر دل نهی به هیچ","ز حالِ ما دلت آگه شود مگر وقتی","سرم خوش است و به بانگ بلند می‌گویم"], answer: 2 },
  { q: "رقم مغلطه بر دفتر دانش نزنیم..", opts: ["تکیه آن به که بر این بحر معلّق نکنیم","سر حق بر ورق شعبده ملحق نکنیم","تا طبیبش به سر آریم و دوایی بکنیم"], answer: 1 },
  { q: "... غرض اندر میان سلامتِ اوست", opts: ["ای آن که به تقریر و بیان دم زنی از عشق","تو و طوبی و ما و قامتِ یار","من و دل گر فدا شدیم چه باک؟"], answer: 2 },
];

let index = 0;
let correctCount = 0; // شمارش پاسخ‌های درست

function loadQuestion() {
  if (index >= questions.length) {
    sendToSheet();
    return;
  }

  const q = questions[index];
  document.getElementById("questionText").innerText = q.q;

  let html = "";
  q.opts.forEach((o, i) => {
    html += `<div class="option" onclick="choose(${i}, this)">${o}</div>`;
  });

  document.getElementById("optionsBox").innerHTML = html;
}

function choose(i, element) {
  const q = questions[index];
  const options = document.querySelectorAll('.option');

  if (i === q.answer) {
    element.classList.add('correct');
    correctCount++;
  } else {
    element.classList.add('wrong');
    options[q.answer].classList.add('correct');
  }

  index++;
  setTimeout(loadQuestion, 1000);
}

// ارسال اطلاعات به گوگل شیت
function sendToSheet() {
  const code = localStorage.getItem("personCode");
  const phone = localStorage.getItem("phoneNumber");

  const url = "https://script.google.com/macros/s/AKfycbxaOsQSmjwM9FkFxIlRAUtLVmGXXs-s93tL7ChphM_PrVhuPUQ0tTTUZ4ArTS1Yrzqs3w/exec";
  fetch(`${url}?code=${code}&phone=${phone}&score=${correctCount}`)
    .then(() => {
      window.location.href = "hafez.html"; // بعد از ذخیره، ادامه فال حافظ
    })
    .catch(() => {
      alert("خطا در ارسال اطلاعات! لطفاً دوباره امتحان کنید.");
    });
}

loadQuestion();
</script>

</body>
</html>
