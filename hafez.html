<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>فال حافظ آنلاین</title>

<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet" />

<style>
  body {
    font-family: 'Vazir', sans-serif;
    direction: rtl;
    background: url("bg.jpg") no-repeat center center fixed;
    background-size: cover;
    margin: 0;
    padding: 0;
    text-align: center;
    position: relative;
    min-height: 100vh;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255, 255, 255, 0.35);
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 2;
    max-width: 700px;
    margin: 30px auto;
    background: rgba(255, 255, 255, 0.92);
    padding: 30px;
    border-radius: 22px;
    box-shadow: 0 0 20px rgba(0,0,0,0.15);
  }

  h1 { 
    color: #b30000; 
    font-size: 32px; 
    margin-bottom: 15px; 
  }

  #poemTitle { 
    color: #900; 
    font-size: 22px; 
    margin-bottom: 15px; 
    font-weight: bold; 
  }

  #poem {
    white-space: pre-line;
    font-size: 20px;
    line-height: 2;
    color: #222;
    margin-top: 20px;
  }

  .unique-code-container {
    margin-top: 25px;
    font-size: 18px;
    background: #f2f2f2;
    padding: 10px 15px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    gap: 10px;
  }

  #copyIcon {
    cursor: pointer;
    transition: 0.2s;
  }
  #copyIcon:hover {
    transform: scale(1.15);
  }

  .instagram-link {
    display: block;
    margin-top: 25px;
    font-size: 18px;
    color: #0075f3;
    text-decoration: none;
    transition: 0.2s;
  }
  .instagram-link:hover { color: #ff1a1a; }
</style>
</head>

<body>

<div class="overlay"></div>

<div class="container">
  <h1>🍉 فال حافظ شب یلدا 🍉</h1>

  <div id="poemTitle">در حال دریافت فال...</div>
  <div id="poem">لطفاً کمی صبر کنید...</div>

  <div class="unique-code-container" style="display:none;">
    <span>کد یونیک شما:</span>
    <span class="unique-code" id="uniqueCode"></span>

    <!-- آیکون کپی (جایگزین دکمه) -->
    <svg id="copyIcon" xmlns="http://www.w3.org/2000/svg" width="26" height="26" fill="#b30000" viewBox="0 0 24 24">
      <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v16c0 1.1.9 2 
      2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 18H8V7h11v16z"/>
    </svg>
  </div>

  <a href="https://www.instagram.com/arena_lifescience/?hl=en" 
     target="_blank" 
     class="instagram-link"
     style="display:flex; justify-content:center; align-items:center; gap:8px;">

    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="#E1306C" viewBox="0 0 24 24">
      <path d="M12 2.2c3.2 0 3.6 0 4.9.1 1.2.1 1.8.3 2.2.5.6.3 1 .7 1.4 1.4.3.4.5 1 
      .5 2.2.1 1.3.1 1.7.1 4.9s0 3.6-.1 4.9c-.1 1.2-.3 1.8-.5 
      2.2-.3.6-.7 1-1.4 1.4-.4.3-1 .5-2.2.5-1.3.1-1.7.1-4.9.1s-3.6 
      0-4.9-.1c-1.2-.1-1.8-.3-2.2-.5-.6-.3-1-.7-1.4-1.4-.3-.4-.5-1-.5-2.2-.1-1.3-.1-1.7-.1-4.9s0-3.6.1-4.9c.1-1.2.3-1.8.5-2.2.3-.6.7-1 
      1.4-1.4.4-.3 1-.5 2.2-.5C8.4 2.2 8.8 2.2 12 2.2m0-2.2C8.7 0 
      8.3 0 7 0.1 5.7 0.2 4.8 0.4 4 0.8c-.9.4-1.6 1-2.2 
      1.7-.7.7-1.3 1.4-1.7 2.2-.4.8-.6 1.7-.7 3C-0 8.8-0 9.3 0 
      12s0 3.2.1 4.5c.1 1.3.3 2.2.7 3 .4.9 1 1.6 1.7 
      2.2.7.7 1.4 1.3 2.2 1.7.8.4 1.7.6 3 
      .7C8.8 24 9.3 24 12 24s3.2 0 4.5-.1c1.3-.1 2.2-.3 
      3-.7.9-.4 1.6-1 2.2-1.7.7-.7 1.3-1.4 
      1.7-2.2.4-.8.6-1.7.7-3 .1-1.3.1-1.8.1-4.5s0-3.2-.1-4.5c-.1-1.3-.3-2.2-.7-3-.4-.9-1-1.6-1.7-2.2-.7-.7-1.4-1.3-2.2-1.7-.8-.4-1.7-.6-3-.7C15.2 0 14.7 0 12 
      0zm0 5.9a6.1 6.1 0 1 0 0 12.2 6.1 6.1 0 0 0 0-12.2zm0 
      10.1a4 4 0 1 1 0-8.1 4 4 0 0 1 0 8.1zm6.4-11a1.4 1.4 0 1 
      1-2.8 0 1.4 1.4 0 0 1 2.8 0z"/>
    </svg>

    arena_lifescience
  </a>
</div>

<script>
  async function getHafez() {
    document.getElementById("poemTitle").innerText = "در حال دریافت فال...";
    document.getElementById("poem").innerText = "لطفاً کمی صبر کنید...";

    try {
      const res = await fetch("https://api.ganjoor.net/api/ganjoor/hafez/faal");
      const data = await res.json();

      let title = data.title || "فال حافظ";
      let poem = data.plainText || "شعری دریافت نشد.";

      document.getElementById("poemTitle").innerText = title;
      document.getElementById("poem").innerText = poem;

      generateUniqueCode();

    } catch (err) {
      document.getElementById("poemTitle").innerText = "خطا در دریافت فال!";
      document.getElementById("poem").innerText = "لطفاً دوباره امتحان کنید.";
    }
  }

  function generateUniqueCode() {
    const timestampPart = Date.now().toString(36).slice(-4).toUpperCase();
    const randomPart = Math.random().toString(36).substring(2, 5).toUpperCase();
    const code = `Yalda-${timestampPart}${randomPart}`;

    document.getElementById("uniqueCode").innerText = code;
    document.querySelector(".unique-code-container").style.display = "inline-flex";
  }

  // آیکون کپی
  document.getElementById("copyIcon").addEventListener("click", () => {
    const code = document.getElementById("uniqueCode").innerText;
    navigator.clipboard.writeText(code).then(() => {
      alert("کد شما کپی شد!");
    });
  });

  getHafez();
</script>

</body>
</html>
