<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شب یلدا | خوش آمدید</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazir-font@v30.1.0/dist/font-face.css" rel="stylesheet">

<style>
  body {
    font-family: 'Vazir', sans-serif;
    direction: rtl;
    background: url("IMG_0144 copy.jpg") no-repeat center center fixed;
    background-size: cover;
    min-height: 100vh;
    text-align: center;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(255, 0, 0, 0.45);
    z-index: 0;
  }

  .box {
    position: relative;
    z-index: 2;
    background: rgba(255,255,255,0.9);
    padding: 35px 40px;
    border-radius: 20px;
    width: 90%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 0 20px rgba(0,0,0,0.2);
  }

  h1 { color: #b30000; margin-bottom: 10px; font-size: 26px; }
  p { font-size: 17px; color: #333; }

  input {
    width: 250px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #bbb;
    margin-top: 15px;
    font-family: 'Vazir', sans-serif;
  }

  button {
    margin-top: 20px;
    padding: 12px 35px;
    background: #b30000;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    transition: .2s;
    font-family: 'Vazir', sans-serif !important;
  }
  button:hover { background: #ff1a1a; transform: scale(1.05); }
</style>
</head>

<body>

<div class="overlay"></div>

<div class="box">
  <h1>🎉 شب یلدا مبارک 🎉</h1>
  <p>برای ورود به بازی لطفاً اطلاعات خود را وارد کنید</p>

  <input type="text" id="personalCode" placeholder="کد پرسنلی" required><br>
  <input type="text" id="phoneNumber" placeholder="شماره موبایل" required><br>

  <button onclick="startGame()">شروع بازی 🍉</button>
</div>

<script>
function startGame() {
  const code = document.getElementById("personalCode").value.trim();
  const phone = document.getElementById("phoneNumber").value.trim();

  if (!code || !phone) {
    alert("لطفاً کد پرسنلی و شماره موبایل خود را وارد کنید");
    return;
  }

  // ذخیره در localStorage برای استفاده در صفحه بازی
  localStorage.setItem("personCode", code);
  localStorage.setItem("phoneNumber", phone);

  window.location.href = "YaldaGame.html";
}
</script>

</body>
</html>
